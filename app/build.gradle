plugins {
    id "com.android.application"
}

// Release versions are explicit and intentionally short, for example 1.1.0.
// CI passes -PappVersion=1.1.0 when publishing a version tag.
def appVersionName = project.findProperty("appVersion") ?: "1.2.5"

def getGitVersionCode() {
    try {
        def cmd = "git rev-list --count HEAD"
        return cmd.execute().text.trim().toInteger()
    } catch (ignored) {
        return 1
    }
}

android {
    namespace "com.example.twkansimple"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.twkansimple"
        minSdk 29
        targetSdk 35
        versionCode getGitVersionCode()
        versionName appVersionName
    }

    signingConfigs {
        release {
            storeFile file("twkan-release.keystore")
            storePassword "twkan123"
            keyAlias "twkan"
            keyPassword "twkan123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
