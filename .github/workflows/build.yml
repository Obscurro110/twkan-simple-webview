name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get version info
      id: ver
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          version="${version:-1.1.0}"
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
        echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Build APK (signed with fixed keystore)
      run: ./gradlew -PappVersion=${{ steps.ver.outputs.version }} assembleDebug assembleRelease --stacktrace

    - name: Rename APK files
      shell: bash
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/debug/app-debug.apk \
          "dist/twkan-simple-webview-v${{ steps.ver.outputs.version }}-debug.apk"
        cp app/build/outputs/apk/release/app-release.apk \
          "dist/twkan-simple-webview-v${{ steps.ver.outputs.version }}-release.apk"

    - name: Create versioned GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Twkan Simple WebView ${{ github.ref_name }}"
        body_path: RELEASE_NOTES.md
        files: |
          dist/twkan-simple-webview-v${{ steps.ver.outputs.version }}-debug.apk
          dist/twkan-simple-webview-v${{ steps.ver.outputs.version }}-release.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twkan-simple-webview-v${{ steps.ver.outputs.version }}-apk
        path: dist/*.apk
